    --navy:#132848;
    --navy-light:#1B3A63;
    --gold:#E3A94A;
    --gold-soft:#F1CD8C;
    --wine:#9A3548;
    --parchment:#F3EEE2;
    --parchment-dim:#E6DCC6;
    --ink:#0D1A2E;
    --muted:#93A2BC;
    --muted-2:#647694;
    --line:rgba(227,169,74,0.22);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy-deep);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:17px;
    line-height:1.6;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:var(--navy-deep);}

  /* ---------- header ---------- */
  header{
    padding:36px 20px 22px;
    text-align:center;
    background:
      radial-gradient(ellipse at top, rgba(227,169,74,0.13), transparent 60%),
      var(--navy-deep);
    border-bottom:1px solid var(--line);
  }
  .eyebrow-route{
    font-size:13px;
    color:var(--gold-soft);
    letter-spacing:0.02em;
    margin-bottom:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .eyebrow-route span:not(.dot){opacity:0.85;}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:0.6;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(28px,6vw,42px);
    letter-spacing:-0.01em;
    color:var(--parchment);
  }
  h1 em{font-style:italic; color:var(--gold-soft); font-weight:400;}
  .dates{
    margin-top:8px;
    font-size:15px;
    color:var(--muted);
  }
  .skyline{
    display:block;
    margin:18px auto 0;
  }
  .progress-wrap{
    max-width:420px;
    margin:20px auto 0;
  }
  .progress-label{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .progress-track{
    height:6px;
    background:var(--navy-light);
    border-radius:99px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--wine), var(--gold));
    border-radius:99px;
    transition:width 0.6s cubic-bezier(.4,0,.2,1);
    width:0%;
  }

  /* ---------- day tabs ---------- */
  nav.days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:16px 16px;
    scrollbar-width:none;
    background:var(--navy);
    border-bottom:1px solid var(--line);
  }
  nav.days::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;
    min-width:66px;
    padding:10px 12px 9px;
    border-radius:12px;
    background:transparent;
    border:1px solid transparent;
    color:var(--muted);
    cursor:pointer;
    text-align:center;
    transition:background 0.2s, border-color 0.2s, color 0.2s;
    position:relative;
  }
  .day-tab .num{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:500;
    color:inherit;
    display:block;
  }
  .day-tab .wd{
    font-size:10.5px;
    color:inherit;
    opacity:0.75;
    display:block;
    margin-top:1px;
  }
  .day-tab.active{
    background:var(--navy-light);
    border-color:var(--line);
    color:var(--parchment);
  }
  .day-tab.active .num{color:var(--gold-soft);}
  .day-tab .check-badge{
    position:absolute;
    top:4px;
    right:6px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--gold);
    opacity:0;
  }
  .day-tab.complete .check-badge{opacity:1;}

  /* ---------- main ---------- */
  main{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 64px;
  }
  .day-panel{display:none; animation:fadeUp 0.45s ease;}
  .day-panel.active{display:block;}
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .day-head{
    margin-bottom:26px;
  }
  .day-head .city{
    font-size:13px;
    color:var(--gold-soft);
    letter-spacing:0.02em;
    margin-bottom:6px;
  }
  .day-head h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(24px,5vw,30px);
    color:var(--parchment);
  }
  .day-head .subtitle{
    color:var(--muted);
    font-size:15px;
    margin-top:4px;
  }

  /* timeline */
  .timeline{
    position:relative;
    padding-left:2px;
  }
  .activity{
    display:grid;
    grid-template-columns:46px 1fr;
    gap:20px;
    position:relative;
    padding-bottom:26px;
  }
  .activity::before{
    content:'';
    position:absolute;
    left:56px;
    top:22px;
    bottom:0;
    width:1px;
    background:var(--line);
  }
  .activity:last-child::before{display:none;}
  .activity .time{
    font-family:'Fraunces',serif;
    font-size:13px;
    color:var(--gold-soft);
    padding-top:8px;
    text-align:right;
    white-space:nowrap;
  }
  .activity .dot-marker{
    position:absolute;
    left:51px;
    top:12px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--navy-deep);
    border:2px solid var(--gold);
    transition:background 0.2s, border-color 0.2s;
  }
  .activity.done .dot-marker{background:var(--gold); border-color:var(--gold);}

  .activity-card{
    background:var(--navy);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    transition:opacity 0.25s, border-color 0.2s;
  }
  .activity.done .activity-card{opacity:0.55;}
  .activity-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .activity-title{
    font-weight:600;
    font-size:16.5px;
    color:var(--parchment);
    line-height:1.4;
    display:flex;
    align-items:center;
    gap:11px;
  }
  .type-icon{
    flex:0 0 auto;
    width:28px;
    height:28px;
    padding:6px;
    border-radius:8px;
    background:var(--navy-light);
    color:var(--gold-soft);
    margin-top:-2px;
  }
  .type-icon svg{width:100%; height:100%; display:block;}
  .activity.done .activity-title{text-decoration:line-through; text-decoration-color:var(--muted);}
  .checkbox{
    flex:0 0 auto;
    width:24px;
    height:24px;
    border-radius:7px;
    border:1.5px solid var(--muted-2);
    background:transparent;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .checkbox:active{transform:scale(0.9);}
  .checkbox svg{width:14px; height:14px; opacity:0; transition:opacity 0.15s;}
  .activity.done .checkbox{background:var(--gold); border-color:var(--gold);}
  .activity.done .checkbox svg{opacity:1;}
  .activity-desc{
    margin-top:8px;
    font-size:14.5px;
    color:var(--muted);
    line-height:1.65;
  }
  .activity-desc ul{
    margin:8px 0 0 18px;
    padding:0;
  }
  .activity-desc li{margin-bottom:3px;}
  .activity-meta{
    margin-top:12px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .tag{
    font-size:12.5px;
    padding:4px 10px;
    border-radius:99px;
    background:var(--navy-light);
    color:var(--gold-soft);
    border:1px solid var(--line);
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .tag-icon{width:12px; height:12px; flex:0 0 auto;}
  .tag.alert{
    color:#E3B8A0;
    border-color:rgba(227,184,160,0.3);
  }

  /* day total */
  .day-total{
    margin-top:8px;
    padding:16px 18px;
    border-radius:14px;
    background:var(--navy-light);
    border:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:6px;
  }
  .day-total .label{font-size:14px; color:var(--muted);}
  .day-total .value{
    font-family:'Fraunces',serif;
    font-size:19px;
    color:var(--gold-soft);
  }

  .day-complete-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    margin-top:14px;
    padding:14px 18px;
    border-radius:12px;
    border:1.5px solid var(--gold);
    background:transparent;
    color:var(--gold-soft);
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background 0.2s, color 0.2s;
  }
  .day-complete-btn svg{width:16px; height:16px;}
  .day-complete-btn.done{
    background:var(--gold);
    color:var(--navy-deep);
  }

  /* empty state */
  .empty-state{
    padding:48px 20px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:16px;
  }
  .empty-state .snowflake{color:var(--gold-soft); opacity:0.8; margin-bottom:10px;}
  .empty-state .icon-line{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:20px;
    color:var(--gold-soft);
    margin-bottom:8px;
  }
  .empty-state p{font-size:14.5px; max-width:340px; margin:0 auto;}

  footer{
    text-align:center;
    padding:26px 20px 40px;
    color:var(--muted-2);
    font-size:12.5px;
  }

  @media (prefers-reduced-motion: reduce){
    .day-panel{animation:none;}
    .progress-fill{transition:none;}
  }
</style>
</head>

const STORAGE_KEY = "europa2026-progress";
let completed = {};

async function loadProgress(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ completed = JSON.parse(res.value); }
  }catch(e){ completed = {}; }
}
async function saveProgress(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(completed), false); }
  catch(e){ console.error("Não foi possível salvar o progresso", e); }
}

const checkIcon = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="#0D1A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function activityHTML(a){
  if(!a.title) return "";
  const isDone = !!completed[a.id];
  const metaTags = [];
  if(a.cost) metaTags.push(`<span class="tag"><svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 8a5.5 5.5 0 1 0 0 8"/><path d="M4 10h9M4 14h7"/></svg>${a.cost}</span>`);
  if(a.meta) metaTags.push(`<span class="tag">${a.meta}</span>`);
  if(a.alert) metaTags.push(`<span class="tag alert"><svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 4.9 2.9 18a1.6 1.6 0 0 0 1.4 2.4h15.4a1.6 1.6 0 0 0 1.4-2.4L13.7 4.9a1.6 1.6 0 0 0-2.8 0Z"/></svg>${a.alert}</span>`);
  const icon = a.type && typeIcons[a.type] ? `<span class="type-icon">${typeIcons[a.type]}</span>` : "";
  return `
    <div class="activity ${isDone?'done':''}" data-id="${a.id}">
      <div class="dot-marker"></div>
      <div class="time">${a.time}</div>
      <div class="activity-card">
        <div class="activity-top">
          <div class="activity-title">${icon}${a.title}</div>
          <button class="checkbox" data-id="${a.id}" aria-label="Marcar como concluído">${checkIcon}</button>
        </div>
        ${a.desc ? `<div class="activity-desc">${a.desc}</div>` : ""}
        ${metaTags.length ? `<div class="activity-meta">${metaTags.join("")}</div>` : ""}
      </div>
    </div>`;
}

function dayPanelHTML(day, idx){
  const hasContent = day.activities && day.activities.length > 0;
  const heading = `
    <div class="day-head">
      ${day.city ? `<div class="city">${day.city}</div>` : ""}
      <h2>${day.title || "Dia " + day.date}</h2>
      ${day.subtitle ? `<div class="subtitle">${day.subtitle}</div>` : ""}
    </div>`;
  if(!hasContent){
    return `<section class="day-panel" data-idx="${idx}">${heading}
      <div class="empty-state">
        <svg class="snowflake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" width="22" height="22" aria-hidden="true"><path d="M12 2v20M4.2 6l15.6 12M4.2 18 19.8 6"/><path d="M12 2 9.5 4.5M12 2l2.5 2.5M12 22l-2.5-2.5M12 22l2.5-2.5M4.2 6l3.3.6M4.2 6l.6-3.3M19.8 6l-3.3.6M19.8 6l-.6-3.3M4.2 18l3.3-.6M4.2 18l.6 3.3M19.8 18l-3.3-.6M19.8 18l-.6 3.3"/></svg>
        <div class="icon-line">em breve</div>
        <p>O roteiro deste dia ainda vai ser adicionado. Assim que estiver pronto, aparece aqui.</p>
      </div>
    </section>`;
  }
  const activities = day.activities.map(activityHTML).join("");
  const total = day.dayTotal ? `<div class="day-total"><span class="label">Total estimado por pessoa</span><span class="value">${day.dayTotal}</span></div>` : "";
  const allDone = day.activities.every(a => completed[a.id]);
  const dayBtn = `<button class="day-complete-btn ${allDone?'done':''}" data-idx="${idx}">
      ${allDone ? `${checkIcon}<span>Dia concluído</span>` : `<span>Marcar dia como concluído</span>`}
    </button>`;
  return `<section class="day-panel" data-idx="${idx}">${heading}
    <div class="timeline">${activities}</div>
    ${total}
    ${dayBtn}
  </section>`;
}

function render(){
  const tabsEl = document.getElementById("day-tabs");
  const panelsEl = document.getElementById("day-panels");
  tabsEl.innerHTML = trip.map((d,i)=>{
    const total = d.activities.length;
    const done = d.activities.filter(a=>completed[a.id]).length;
    const complete = total > 0 && done === total;
    return `<button class="day-tab ${complete?'complete':''}" data-idx="${i}">
      <span class="num">${d.date.split(" ")[0]}</span>
      <span class="wd">${d.weekday}</span>
      <span class="check-badge"></span>
    </button>`;
  }).join("");
  panelsEl.innerHTML = trip.map(dayPanelHTML).join("");
  updateProgress();
}

function updateProgress(){
  let total = 0, done = 0;
  trip.forEach(d => d.activities.forEach(a => { total++; if(completed[a.id]) done++; }));
  document.getElementById("progress-text").textContent = `${done} de ${total} atividades`;
  document.getElementById("progress-fill").style.width = total ? `${(done/total)*100}%` : "0%";
}

let activeIdx = 2; // começa no Dia 28, o único preenchido por ora

function setActive(idx){
  activeIdx = idx;
  document.querySelectorAll(".day-tab").forEach(t=>t.classList.toggle("active", +t.dataset.idx === idx));
  document.querySelectorAll(".day-panel").forEach(p=>p.classList.toggle("active", +p.dataset.idx === idx));
  document.querySelector(`.day-tab[data-idx="${idx}"]`)?.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
}

document.addEventListener("click", async (e)=>{
  const tab = e.target.closest(".day-tab");
  if(tab){ setActive(+tab.dataset.idx); return; }

  const box = e.target.closest(".checkbox");
  if(box){
    const id = box.dataset.id;
    completed[id] = !completed[id];
    box.closest(".activity").classList.toggle("done", completed[id]);
    updateProgress();
    render(); // refresh tab badges
    setActive(activeIdx);
    await saveProgress();
    return;
  }

  const dayBtn = e.target.closest(".day-complete-btn");
  if(dayBtn){
    const idx = +dayBtn.dataset.idx;
    const day = trip[idx];
    const allDone = day.activities.every(a => completed[a.id]);
    day.activities.forEach(a => { completed[a.id] = !allDone; });
    render();
    setActive(idx);
    await saveProgress();
  }
});

(async function init(){
  await loadProgress();
  render();
  setActive(activeIdx);
})();
</script>
